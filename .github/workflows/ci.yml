name: CI
on:
  push:
    branches: [main]
    paths: ["app/**", "src/**", "tests/**", "requirements*.txt", ".github/workflows/ci.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r requirements-api.txt
          pip install timeseries-cv statsmodels pandas pyyaml pytest flake8 httpx
      - name: Lint
        run: flake8 app/ src/ tests/ --max-line-length 130 --extend-ignore E203,W503
      - name: Pruebas
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: pytest -q tests/
