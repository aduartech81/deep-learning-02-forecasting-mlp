# Construye el Jupyter Book con las salidas ya guardadas en los notebooks y lo publica en GitHub Pages.
# No ejecuta los notebooks (las corridas se hacen en Colab; ver README).
name: Publicar Jupyter Book

on:
  push:
    branches: [main]
    paths: ["notebooks/**", "intro.md", "_config.yml", "_toc.yml", ".github/workflows/book.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Jupyter Book
        run: pip install "jupyter-book==1.0.4.post1"
      - name: Construir el libro (sin ejecutar notebooks)
        run: jupyter-book build .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
