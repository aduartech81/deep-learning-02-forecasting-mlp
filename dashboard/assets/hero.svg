<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Serie de precios con una ventana de entrada que alimenta una red neuronal y un pronóstico de varios días">
  <rect width="520" height="400" rx="18" fill="#eef4fc"/>
  <!-- ejes -->
  <line x1="40" y1="300" x2="480" y2="300" stroke="#c3c2b7" stroke-width="1.5"/>
  <!-- serie histórica -->
  <polyline fill="none" stroke="#2a78d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="40,250 62,238 80,246 100,220 118,228 136,196 152,206 170,182 188,192 206,160 224,172 242,150 260,166 278,144 296,152"/>
  <!-- ventana de entrada -->
  <rect x="206" y="128" width="92" height="140" rx="10" fill="#2a78d6" fill-opacity="0.08" stroke="#2a78d6" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="252" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1c5cab">lags</text>
  <!-- pronóstico -->
  <polyline fill="none" stroke="#eb6834" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"
    points="296,152 318,146 340,150 362,142 384,147 406,140"/>
  <polyline fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="2 5" points="296,152 406,152"/>
  <rect x="300" y="110" width="110" height="160" rx="10" fill="#eb6834" fill-opacity="0.06"/>
  <text x="355" y="288" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#c4521f">H = 7…28 días</text>
  <!-- red neuronal -->
  <g transform="translate(150,40)">
    <g stroke="#9ec5f4" stroke-width="1.3">
      <path d="M20 10 L80 0 M20 10 L80 30 M20 10 L80 60 M20 40 L80 0 M20 40 L80 30 M20 40 L80 60 M20 70 L80 0 M20 70 L80 30 M20 70 L80 60"/>
      <path d="M80 0 L140 15 M80 30 L140 15 M80 60 L140 15 M80 0 L140 50 M80 30 L140 50 M80 60 L140 50"/>
      <path d="M140 15 L200 30 M140 50 L200 30"/>
    </g>
    <g stroke="#ffffff" stroke-width="2.5">
      <circle cx="20" cy="10" r="8" fill="#1baf7a"/><circle cx="20" cy="40" r="8" fill="#1baf7a"/><circle cx="20" cy="70" r="8" fill="#1baf7a"/>
      <circle cx="80" cy="0" r="8" fill="#2a78d6"/><circle cx="80" cy="30" r="8" fill="#2a78d6"/><circle cx="80" cy="60" r="8" fill="#2a78d6"/>
      <circle cx="140" cy="15" r="8" fill="#1c5cab"/><circle cx="140" cy="50" r="8" fill="#1c5cab"/>
      <circle cx="200" cy="30" r="10" fill="#eb6834"/>
    </g>
  </g>
  <text x="260" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#52514e">Últimos cierres → MLP multisalida → próximos H días</text>
  <text x="260" y="366" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#898781">línea gris punteada: pronóstico ingenuo (último valor)</text>
</svg>
